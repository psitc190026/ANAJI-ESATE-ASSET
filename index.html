<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C4A9A">
<title>Church Asset Manager</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="config.js"></script>
<style>
/* ---------- Brand: The Church of Pentecost blue, gold and red ---------- */
:root {
  --brand: #0C4A9A;
  --brand-dark: #08346D;
  --brand-hover: #093C7E;
  --brand-tint: #E8EFF9;
  --brand-line: #C9D8EE;
  --gold: #F8E80A;
  --flame: #E52421;

  --bs-primary: #0C4A9A;
  --bs-primary-rgb: 12, 74, 154;
  --bs-primary-bg-subtle: #E8EFF9;
  --bs-primary-border-subtle: #B9CCE8;
  --bs-primary-text-emphasis: #08346D;
  --bs-link-color: #0C4A9A;
  --bs-link-color-rgb: 12, 74, 154;
  --bs-link-hover-color: #08346D;
  --bs-link-hover-color-rgb: 8, 52, 109;
  --bs-danger: #C8201D;
  --bs-danger-rgb: 200, 32, 29;
  --bs-body-font-family: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --page-bg: #F5F8FC;
  --bs-body-color: #1B2433;
  --bs-border-color: #DCE4EF;
  --bs-border-radius: .5rem;
  --bs-border-radius-lg: .75rem;
}
[hidden] { display: none !important; }
body { background: var(--page-bg); }
.min-w-0 { min-width: 0; }

.btn-primary {
  --bs-btn-bg: var(--brand); --bs-btn-border-color: var(--brand);
  --bs-btn-hover-bg: var(--brand-hover); --bs-btn-hover-border-color: var(--brand-hover);
  --bs-btn-active-bg: var(--brand-dark); --bs-btn-active-border-color: var(--brand-dark);
  --bs-btn-disabled-bg: var(--brand); --bs-btn-disabled-border-color: var(--brand);
  --bs-btn-focus-shadow-rgb: 12, 74, 154;
}
.btn-outline-primary {
  --bs-btn-color: var(--brand); --bs-btn-border-color: var(--brand);
  --bs-btn-hover-bg: var(--brand); --bs-btn-hover-border-color: var(--brand);
  --bs-btn-active-bg: var(--brand-dark); --bs-btn-active-border-color: var(--brand-dark);
  --bs-btn-focus-shadow-rgb: 12, 74, 154;
}
.nav-pills { --bs-nav-pills-link-active-bg: var(--brand); --bs-nav-link-color: var(--brand); --bs-nav-link-hover-color: var(--brand-dark); }
.form-control:focus, .form-select:focus, .form-check-input:focus {
  border-color: #6E95CC; box-shadow: 0 0 0 .25rem rgba(12, 74, 154, .2);
}
.form-check-input:checked { background-color: var(--brand); border-color: var(--brand); }
.btn:focus-visible, .nav-link:focus-visible, .list-group-item-action:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }

/* ---------- Login ---------- */
#login {
  min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem;
  background: linear-gradient(180deg, var(--brand) 0 42%, var(--bs-body-bg) 42% 100%);
}
.login-card { width: 100%; max-width: 400px; }
.login-logo { width: 120px; height: 120px; margin: -76px auto 1rem; display: block;
  background: #fff; border-radius: 50%; box-shadow: 0 6px 20px rgba(8, 52, 109, .25); }

/* ---------- Layout ---------- */
.brandbar { background: var(--brand); }
.brandbar .navbar-brand { color: #fff; font-weight: 700; display: flex; align-items: center; gap: .6rem; font-size: 1rem; line-height: 1.2; }
.brandbar img { width: 38px; height: 38px; background: #fff; border-radius: 50%; }

.sidebar.offcanvas-lg { --bs-offcanvas-width: 280px; background: var(--brand); color: #fff; }
.sidebar .btn-close { filter: invert(1) grayscale(1) brightness(2); }
.side-brand { text-align: center; padding: .5rem .5rem 1.5rem; border-bottom: 1px solid rgba(255,255,255,.15); margin-bottom: 1rem; }
.side-brand img { width: 96px; height: 96px; background: #fff; border-radius: 50%; padding: 2px; margin-bottom: .75rem; }
.side-brand strong { display: block; font-size: 1.05rem; line-height: 1.25; }
.side-brand span { display: block; font-size: .85rem; color: var(--gold); font-weight: 700; margin-top: .15rem; }
.side-nav .nav-link {
  color: rgba(255,255,255,.85); display: flex; align-items: center; gap: .75rem;
  padding: .65rem .9rem; border-radius: .5rem; border-left: 4px solid transparent; width: 100%; text-align: left;
}
.side-nav .nav-link i { font-size: 1.15rem; }
.side-nav .nav-link:hover { color: #fff; background: rgba(255,255,255,.08); }
.side-nav .nav-link.active { color: #fff; background: rgba(255,255,255,.16); border-left-color: var(--gold); font-weight: 700; }
.side-nav .badge { margin-left: auto; background: var(--gold); color: #1B2433; }
.side-foot { margin-top: auto; padding-top: 1rem; border-top: 1px solid rgba(255,255,255,.15); font-size: .85rem; color: rgba(255,255,255,.8); }
.side-foot .btn { --bs-btn-color: #fff; --bs-btn-border-color: rgba(255,255,255,.35); --bs-btn-hover-bg: rgba(255,255,255,.12); --bs-btn-hover-border-color: #fff; --bs-btn-hover-color: #fff; }

@media (min-width: 992px) {
  .sidebar-wrap { width: 270px; flex: none; background: var(--brand); position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .sidebar.offcanvas-lg { height: 100%; }
  .sidebar .offcanvas-body { flex-direction: column; height: 100%; padding: 1.5rem 1rem !important; }
}
main { min-width: 0; flex: 1; }
.page { max-width: 1240px; padding: 1.75rem clamp(1rem, 3vw, 2.25rem) 3rem; }
.page-title { font-size: 1.6rem; font-weight: 700; margin: 0; }

/* ---------- Components ---------- */
.card { --bs-card-border-color: var(--bs-border-color); --bs-card-cap-bg: #fff; box-shadow: 0 1px 2px rgba(16, 38, 74, .05); }
.card-header { font-weight: 700; padding: .9rem 1.25rem; }
.stat-card .icon { width: 46px; height: 46px; border-radius: .6rem; display: grid; place-items: center; font-size: 1.35rem; background: var(--brand-tint); color: var(--brand); flex: none; }
.stat-card .icon.gold { background: #FFF8C4; color: #7A6A00; }
.stat-card .icon.red { background: #FCE6E5; color: var(--bs-danger); }
.stat-card .value { font-size: 1.5rem; font-weight: 700; line-height: 1.2; }
@media (max-width: 575.98px) { .stat-card .icon { display: none; } .stat-card .value { font-size: 1.2rem; } .stat-card .card-body { padding: .85rem; } }
.table > :not(caption) > * > * { padding: .75rem .9rem; }
.table-sm > :not(caption) > * > * { padding: .4rem .6rem; }
.table thead th { font-size: .82rem; color: var(--bs-secondary-color); font-weight: 700; background: #F3F6FA; white-space: nowrap; }
.table-hover tbody tr[data-action] { cursor: pointer; }
.flex-none { flex: none; }
.thumb { width: 42px; height: 42px; border-radius: .4rem; object-fit: cover; background: var(--brand-tint); display: grid; place-items: center; color: #7F9AC2; flex: none; }
.detail-photo { width: 100%; aspect-ratio: 1; border-radius: .75rem; object-fit: cover; background: var(--brand-tint); display: grid; place-items: center; color: #7F9AC2; font-size: 2.5rem; }
.list-group-item-action { cursor: pointer; }
.alert-item { border-left: 4px solid var(--bs-warning) !important; }
.alert-item.urgent { border-left-color: var(--bs-danger) !important; }
.empty { text-align: center; padding: 3rem 1rem; color: var(--bs-secondary-color); }
.empty i { font-size: 2.5rem; color: #9DB3D3; display: block; margin-bottom: .5rem; }
.nav-pills .nav-link { font-weight: 700; }
dl.facts dt { font-weight: 400; color: var(--bs-secondary-color); }
dl.facts dd { margin-bottom: .45rem; }
.modal-header { background: var(--brand); color: #fff; }
.modal-header .btn-close { filter: invert(1) grayscale(1) brightness(2); }
#confirmModal { background: rgba(10, 25, 50, .45); z-index: 1070; }
#confirmModal .modal-header { background: #fff; color: inherit; }
#confirmModal .modal-header .btn-close { filter: none; }
.print-head { display: none; }

@media print {
  body { background: #fff; }
  .sidebar-wrap, .brandbar, .no-print, .toast-container, .modal { display: none !important; }
  .page { padding: 0; max-width: none; }
  .print-head { display: flex !important; align-items: center; gap: 1rem; margin-bottom: 1rem; }
  .print-head img { width: 64px; height: 64px; }
  .card { border: 0; box-shadow: none; }
  .table { font-size: 11px; }
  .table > :not(caption) > * > * { padding: 4px 6px; }
}
@media (prefers-reduced-motion: reduce) { .modal.fade .modal-dialog, .offcanvas, .toast { transition: none !important; } }
</style>
</head>
<body>

<!-- ============ Login ============ -->
<section id="login" hidden>
  <div class="card login-card border-0 shadow">
    <div class="card-body p-4 pt-0">
      <img class="login-logo" src="logo.png" alt="Church logo">
      <h1 class="h4 text-center fw-bold mb-0 js-church">The Church of Pentecost</h1>
      <p class="text-center text-body-secondary mb-4"><span class="js-branch">Anaji Estate Central</span> · Asset Manager</p>
      <div id="setup-notice" class="alert alert-danger" hidden>
        The app is not connected yet. Open <b>config.js</b> and paste your Supabase project URL and key.
      </div>
      <form id="login-form" novalidate>
        <div class="form-floating mb-3">
          <input type="email" class="form-control" id="login-email" name="email" placeholder="name@example.com" required autocomplete="username">
          <label for="login-email">Email address</label>
        </div>
        <div class="form-floating mb-3">
          <input type="password" class="form-control" id="login-password" name="password" placeholder="Password" required autocomplete="current-password">
          <label for="login-password">Password</label>
        </div>
        <div id="login-error" class="alert alert-danger py-2" hidden></div>
        <button class="btn btn-primary btn-lg w-100" type="submit">Sign in</button>
      </form>
    </div>
  </div>
</section>

<!-- ============ App ============ -->
<div id="app" hidden>
  <nav class="navbar brandbar d-lg-none sticky-top no-print">
    <div class="container-fluid">
      <span class="navbar-brand"><img src="logo.png" alt=""><span class="js-branch">Anaji Estate Central</span></span>
      <button class="btn text-white fs-3 p-1 position-relative" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidenav" aria-controls="sidenav" aria-label="Open menu">
        <i class="bi bi-list"></i><span id="menu-badge" class="position-absolute top-0 end-0 badge rounded-pill bg-danger" style="font-size:.65rem" hidden></span>
      </button>
    </div>
  </nav>

  <div class="d-lg-flex">
    <div class="sidebar-wrap no-print">
      <aside class="offcanvas-lg offcanvas-start sidebar" tabindex="-1" id="sidenav" aria-label="Main menu">
        <div class="offcanvas-header d-lg-none">
          <span></span>
          <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#sidenav" aria-label="Close menu"></button>
        </div>
        <div class="offcanvas-body d-flex flex-column p-3 pt-0">
          <div class="side-brand">
            <img src="logo.png" alt="Church logo">
            <strong class="js-church">The Church of Pentecost</strong>
            <span class="js-branch">Anaji Estate Central</span>
          </div>
          <nav class="nav flex-column gap-1 side-nav" id="nav"></nav>
          <div class="side-foot">
            <div class="text-truncate mb-2"><i class="bi bi-person-circle me-1"></i><span id="user-email"></span></div>
            <button class="btn btn-sm btn-outline-light w-100" data-action="logout"><i class="bi bi-box-arrow-right me-1"></i>Sign out</button>
          </div>
        </div>
      </aside>
    </div>
    <main><div class="page" id="view"></div></main>
  </div>
</div>

<!-- Main dialog -->
<div class="modal fade" id="modal" tabindex="-1" aria-labelledby="modal-title" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable modal-fullscreen-sm-down">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title fs-5" id="modal-title"></h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>
</div>

<!-- Confirmation dialog -->
<div class="modal fade" id="confirmModal" tabindex="-1" aria-labelledby="confirm-title" aria-hidden="true" data-bs-backdrop="static">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header border-0 pb-0">
        <h2 class="modal-title fs-5" id="confirm-title"></h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cancel"></button>
      </div>
      <div class="modal-body" id="confirm-body"></div>
      <div class="modal-footer border-0 pt-0">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-danger" id="confirm-ok">Delete</button>
      </div>
    </div>
  </div>
</div>

<div class="toast-container position-fixed bottom-0 start-50 translate-middle-x p-3">
  <div id="toast" class="toast align-items-center text-bg-dark border-0" role="status" aria-live="polite" aria-atomic="true">
    <div class="d-flex"><div class="toast-body fw-bold" id="toast-body"></div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button></div>
  </div>
</div>

<script>
/* =====================================================
   Church Asset Manager (Bootstrap 5 edition)
   ===================================================== */
const RAW = window.CONFIG || {};
const CFG = Object.assign({ CURRENCY: "GHS", REMINDER_DAYS: 14 }, RAW);
if (!RAW.CHURCH_NAME || RAW.CHURCH_NAME === "Our Church") CFG.CHURCH_NAME = "The Church of Pentecost";
if (!RAW.BRANCH_NAME) CFG.BRANCH_NAME = "Anaji Estate Central";
const FULL_NAME = `${CFG.CHURCH_NAME}, ${CFG.BRANCH_NAME}`;

const configured = CFG.SUPABASE_URL && !CFG.SUPABASE_URL.startsWith("PASTE") && CFG.SUPABASE_ANON_KEY && !CFG.SUPABASE_ANON_KEY.startsWith("PASTE");
const sb = configured ? supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY) : null;
const BUCKET = "asset-photos";

const STATUSES = ["In use", "In storage", "Under repair", "Lost", "Disposed"];
const CONDITIONS = ["New", "Good", "Fair", "Poor"];
const STATUS_TONE = { "In use": "success", "In storage": "primary", "Under repair": "warning", "Lost": "danger", "Disposed": "secondary" };

const S = {
  assets: [], categories: [], locations: [], ministries: [], borrowings: [], maintenance: [],
  photos: {}, view: "dashboard",
  filters: { q: "", category: "", location: "", ministry: "", status: "" },
  loanTab: "out", report: "register"
};

const NAV = [
  { id: "dashboard", label: "Dashboard", icon: "speedometer2" },
  { id: "assets", label: "Assets", icon: "box-seam" },
  { id: "loans", label: "Borrowing", icon: "arrow-left-right" },
  { id: "maintenance", label: "Maintenance", icon: "tools" },
  { id: "reports", label: "Reports", icon: "file-earmark-bar-graph" },
  { id: "lists", label: "Lists", icon: "card-checklist" }
];

/* ---------- Helpers ---------- */
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const daysUntil = (d) => Math.round((new Date(d + "T00:00") - new Date(today() + "T00:00")) / 86400000);
const fmtDate = (d) => d ? new Date(d + "T00:00").toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" }) : "—";
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
let moneyFmt;
try { moneyFmt = new Intl.NumberFormat(undefined, { style: "currency", currency: CFG.CURRENCY }); }
catch { moneyFmt = { format: (n) => `${CFG.CURRENCY} ${Number(n).toFixed(2)}` }; }
let wholeFmt;
try { wholeFmt = new Intl.NumberFormat(undefined, { style: "currency", currency: CFG.CURRENCY, maximumFractionDigits: 0 }); }
catch { wholeFmt = { format: (n) => `${CFG.CURRENCY} ${Math.round(n)}` }; }
const money = (n) => (n === null || n === undefined || n === "") ? "—" : moneyFmt.format(Number(n));
const nameOf = (list, id) => list.find((x) => x.id === id)?.name || "—";
const assetById = (id) => S.assets.find((a) => a.id === Number(id));
const assetName = (id) => assetById(id)?.name || "(deleted item)";
const openLoan = (assetId) => S.borrowings.find((b) => b.asset_id === assetId && !b.returned_on);
const nextDue = (assetId) => {
  const recs = S.maintenance.filter((m) => m.asset_id === assetId).sort((a, b) => b.service_date.localeCompare(a.service_date));
  return recs[0]?.next_due || null;
};
const numOrNull = (v) => (v === null || v === "" ? null : Number(v));
const textOrNull = (v) => { const t = String(v ?? "").trim(); return t ? t : null; };
const options = (list, selected, blank = "— None —") =>
  `<option value="">${blank}</option>` + list.map((x) => `<option value="${x.id}" ${x.id === selected ? "selected" : ""}>${esc(x.name)}</option>`).join("");
const plainOptions = (arr, selected) => arr.map((v) => `<option ${v === selected ? "selected" : ""}>${v}</option>`).join("");
const badge = (tone, text, icon = "") =>
  `<span class="badge rounded-pill bg-${tone}-subtle text-${tone}-emphasis border border-${tone}-subtle">${icon ? `<i class="bi bi-${icon} me-1"></i>` : ""}${text}</span>`;

/* ---------- Bootstrap components ---------- */
const modalEl = $("#modal");
const bsModal = new bootstrap.Modal(modalEl, { focus: false });
let modalOpen = false;
modalEl.addEventListener("show.bs.modal", () => (modalOpen = true));
modalEl.addEventListener("hidden.bs.modal", () => { modalOpen = false; $("#modal-body").innerHTML = ""; });
const bsToast = bootstrap.Toast.getOrCreateInstance($("#toast"), { delay: 2800 });
const bsConfirm = new bootstrap.Modal($("#confirmModal"));

function toast(msg) { $("#toast-body").textContent = msg; bsToast.show(); }
function friendlyError(err) {
  const m = err?.message || String(err);
  if (/duplicate key/i.test(m)) return "That name or asset tag is already in use. Choose a different one.";
  if (/Failed to fetch/i.test(m)) return "Could not reach the database. Check your internet connection and try again.";
  return m;
}
function confirmDialog(title, bodyHtml, okLabel = "Delete") {
  return new Promise((resolve) => {
    $("#confirm-title").textContent = title;
    $("#confirm-body").innerHTML = bodyHtml;
    const ok = $("#confirm-ok"); ok.textContent = okLabel;
    let result = false;
    const onOk = () => { result = true; bsConfirm.hide(); };
    ok.addEventListener("click", onOk, { once: true });
    $("#confirmModal").addEventListener("hidden.bs.modal", () => { ok.removeEventListener("click", onOk); resolve(result); }, { once: true });
    bsConfirm.show();
  });
}
function closeMenu() { const oc = bootstrap.Offcanvas.getInstance($("#sidenav")); if (oc) oc.hide(); }

/* ---------- Data ---------- */
async function loadAll() {
  const q = (t, col, asc) => sb.from(t).select("*").order(col, { ascending: asc });
  const res = await Promise.all([
    q("assets", "name", true), q("categories", "name", true), q("locations", "name", true),
    q("ministries", "name", true), q("borrowings", "borrowed_on", false), q("maintenance", "service_date", false)
  ]);
  const bad = res.find((r) => r.error);
  if (bad) throw bad.error;
  [S.assets, S.categories, S.locations, S.ministries, S.borrowings, S.maintenance] = res.map((r) => r.data || []);
  S.photos = {};
  const paths = S.assets.map((a) => a.photo_path).filter(Boolean);
  if (paths.length) {
    const { data } = await sb.storage.from(BUCKET).createSignedUrls(paths, 60 * 60 * 6);
    (data || []).forEach((d) => { if (d.signedUrl) S.photos[d.path] = d.signedUrl; });
  }
}
async function refresh() {
  try { await loadAll(); render(); }
  catch (err) { toast(friendlyError(err)); }
}

/* ---------- Auth ---------- */
async function init() {
  document.querySelectorAll(".js-church").forEach((el) => (el.textContent = CFG.CHURCH_NAME));
  document.querySelectorAll(".js-branch").forEach((el) => (el.textContent = CFG.BRANCH_NAME));
  document.title = `Assets · ${CFG.BRANCH_NAME}`;
  if (!configured) { $("#setup-notice").hidden = false; $("#login-form").hidden = true; showLogin(); return; }
  const { data: { session } } = await sb.auth.getSession();
  session ? startApp(session) : showLogin();
  sb.auth.onAuthStateChange((event) => { if (event === "SIGNED_OUT") showLogin(); });
}
function showLogin() { $("#app").hidden = true; $("#login").hidden = false; }
async function startApp(session) {
  $("#login").hidden = true; $("#app").hidden = false;
  $("#user-email").textContent = session.user.email;
  $("#view").innerHTML = `<div class="d-flex align-items-center gap-2 text-body-secondary"><div class="spinner-border spinner-border-sm text-primary"></div> Loading assets…</div>`;
  try { await loadAll(); }
  catch (err) {
    $("#view").innerHTML = `<div class="alert alert-danger"><b>Could not load data.</b> ${esc(friendlyError(err))}<br>Check that you ran <b>setup.sql</b> in Supabase.</div>`;
    return;
  }
  render();
}
$("#login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const form = e.target;
  if (!form.checkValidity()) { form.classList.add("was-validated"); return; }
  const fd = new FormData(form), btn = form.querySelector("button"), errBox = $("#login-error");
  btn.disabled = true; btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Signing in`;
  errBox.hidden = true;
  const { data, error } = await sb.auth.signInWithPassword({ email: fd.get("email"), password: fd.get("password") });
  btn.disabled = false; btn.textContent = "Sign in";
  if (error) { errBox.textContent = error.message === "Invalid login credentials" ? "Email or password is incorrect." : error.message; errBox.hidden = false; return; }
  form.reset(); form.classList.remove("was-validated");
  startApp(data.session);
});

/* ---------- Alerts ---------- */
function getAlerts() {
  const alerts = [];
  S.borrowings.filter((b) => !b.returned_on && b.due_on).forEach((b) => {
    const d = daysUntil(b.due_on);
    if (d < 0) alerts.push({ urgent: true, icon: "arrow-left-right", when: d, asset: b.asset_id, text: `${assetName(b.asset_id)} is overdue`, sub: `${b.borrower_name} was due to return it ${plural(-d, "day")} ago` });
    else if (d <= 2) alerts.push({ urgent: false, icon: "arrow-left-right", when: d, asset: b.asset_id, text: `${assetName(b.asset_id)} is due back ${d === 0 ? "today" : d === 1 ? "tomorrow" : "in 2 days"}`, sub: `Borrowed by ${b.borrower_name}` });
  });
  S.assets.filter((a) => a.status !== "Disposed" && a.status !== "Lost").forEach((a) => {
    const n = nextDue(a.id); if (!n) return;
    const d = daysUntil(n);
    if (d < 0) alerts.push({ urgent: true, icon: "tools", when: d, asset: a.id, text: `${a.name} is overdue for servicing`, sub: `Was due ${fmtDate(n)}` });
    else if (d <= CFG.REMINDER_DAYS) alerts.push({ urgent: false, icon: "tools", when: d, asset: a.id, text: `${a.name} needs servicing ${d === 0 ? "today" : `in ${plural(d, "day")}`}`, sub: `Due ${fmtDate(n)}` });
  });
  return alerts.sort((x, y) => x.when - y.when);
}

/* ---------- Render ---------- */
function render() {
  const urgent = getAlerts().filter((a) => a.urgent).length;
  $("#nav").innerHTML = NAV.map((n) => `
    <button class="nav-link ${S.view === n.id ? "active" : ""}" data-action="nav" data-view="${n.id}" ${S.view === n.id ? 'aria-current="page"' : ""}>
      <i class="bi bi-${n.icon}"></i>${n.label}
      ${n.id === "dashboard" && urgent ? `<span class="badge rounded-pill" aria-label="${urgent} urgent">${urgent}</span>` : ""}
    </button>`).join("");
  const mb = $("#menu-badge"); mb.hidden = !urgent; mb.textContent = urgent;
  const views = { dashboard: viewDashboard, assets: viewAssets, loans: viewLoans, maintenance: viewMaintenance, reports: viewReports, lists: viewLists };
  $("#view").innerHTML = views[S.view]();
  if (S.view === "assets") renderAssetResults();
  if (S.view === "reports") renderReport();
}

function pageHead(title, sub, actions = "") {
  return `<div class="d-flex flex-wrap gap-3 align-items-end justify-content-between mb-4 no-print">
    <div><h1 class="page-title">${title}</h1>${sub ? `<div class="text-body-secondary">${sub}</div>` : ""}</div>
    <div class="d-flex flex-wrap gap-2">${actions}</div></div>`;
}
function statusBadge(a) {
  const loan = openLoan(a.id);
  return `${badge(STATUS_TONE[a.status] || "secondary", esc(a.status))}${loan ? " " + badge("warning", "On loan", "arrow-left-right") : ""}`;
}
function thumb(a) {
  const url = a.photo_path && S.photos[a.photo_path];
  return url ? `<img class="thumb" src="${url}" alt="">` : `<div class="thumb"><i class="bi bi-image"></i></div>`;
}
const emptyState = (icon, text, btn = "") => `<div class="empty"><i class="bi bi-${icon}"></i>${text}${btn ? `<div class="mt-3">${btn}</div>` : ""}</div>`;
const addAssetBtn = (label = "Add asset") => `<button class="btn btn-primary" data-action="add-asset"><i class="bi bi-plus-lg me-1"></i>${label}</button>`;

/* ----- Dashboard ----- */

      </div></div></div>`;
  return pageHead("Dashboard", esc(FULL_NAME), addAssetBtn()) + `
    <div class="row g-3 mb-4">

      ${stat("cash-stack", "", wholeFmt.format(value), "Total recorded value")}

      <div class="col-lg-7"><div class="card h-100">
        <div class="card-header d-flex justify-content-between align-items-center"><span><i class="bi bi-bell me-2 text-primary"></i>Needs attention</span>
          ${alerts.length ? `<span class="badge text-bg-primary rounded-pill">${alerts.length}</span>` : ""}</div>
        ${alerts.length ? `<div class="list-group list-group-flush">${alerts.map((a) => `
          <button class="list-group-item list-group-item-action alert-item ${a.urgent ? "urgent" : ""} d-flex gap-3 align-items-start py-3" data-action="open-asset" data-id="${a.asset}">

            ${a.urgent ? `<span class="ms-auto">${badge("danger", "Overdue")}</span>` : ""}

      </div></div>
      <div class="col-lg-5"><div class="card h-100">
        <div class="card-header d-flex justify-content-between align-items-center"><span><i class="bi bi-clock-history me-2 text-primary"></i>Recently added</span>

function filteredAssets() {

      </tr>`).join("")}</tbody></table></div>
    <div class="card-footer bg-white text-body-secondary small">Showing ${list.length} of ${S.assets.length}</div></div>`;

/* ----- Borrowing ----- */
function viewLoans() {
  const out = S.borrowings.filter((b) => !b.returned_on).sort((a, b) => (a.due_on || "9999").localeCompare(b.due_on || "9999"));
  const rows = S.loanTab === "out" ? out : S.borrowings;
  const dueCell = (b) => {
    if (b.returned_on) return fmtDate(b.due_on);
    if (!b.due_on) return '<span class="text-body-secondary">No date</span>';
    const d = daysUntil(b.due_on);
    return `${fmtDate(b.due_on)} ${d < 0 ? badge("danger", "Overdue") : d <= 2 ? badge("warning", "Soon") : ""}`;
  };
  return pageHead("Borrowing", `${plural(out.length, "item")} currently out`,
      `<button class="btn btn-primary" data-action="lend"><i class="bi bi-box-arrow-up-right me-1"></i>Lend an item</button>`) + `
    <ul class="nav nav-pills mb-3" role="tablist">
      <li class="nav-item"><button class="nav-link ${S.loanTab === "out" ? "active" : ""}" data-action="loan-tab" data-tab="out">Out now <span class="badge ${S.loanTab === "out" ? "bg-white text-primary" : "text-bg-primary"} ms-1">${out.length}</span></button></li>
      <li class="nav-item"><button class="nav-link ${S.loanTab === "all" ? "active" : ""}" data-action="loan-tab" data-tab="all">Full history</button></li>
    </ul>
    <div class="card">${rows.length ? `<div class="table-responsive"><table class="table align-middle mb-0">
      <thead><tr><th>Item</th><th>Borrower</th><th class="d-none d-md-table-cell">Purpose</th><th class="d-none d-md-table-cell">Borrowed</th><th>Due back</th><th>${S.loanTab === "out" ? "" : "Returned"}</th></tr></thead>
      <tbody>${rows.map((b) => `<tr>
        <td><a href="#" class="fw-bold text-decoration-none" data-action="open-asset" data-id="${b.asset_id}">${esc(assetName(b.asset_id))}</a></td>
        <td>${esc(b.borrower_name)}${b.borrower_phone ? `<div class="small"><a href="tel:${esc(b.borrower_phone)}" class="text-body-secondary"><i class="bi bi-telephone me-1"></i>${esc(b.borrower_phone)}</a></div>` : ""}</td>
        <td class="d-none d-md-table-cell">${esc(b.purpose || "—")}</td>
        <td class="d-none d-md-table-cell text-nowrap">${fmtDate(b.borrowed_on)}</td>
        <td class="text-nowrap">${dueCell(b)}</td>
        <td class="text-end">${b.returned_on ? `<span class="text-nowrap">${fmtDate(b.returned_on)}</span>` : `<button class="btn btn-sm btn-outline-primary text-nowrap" data-action="return-loan" data-id="${b.id}"><i class="bi bi-check2 me-1"></i>Mark returned</button>`}</td>
      </tr>`).join("")}</tbody></table></div>`
    : emptyState("inbox", S.loanTab === "out" ? "Nothing is out on loan right now." : "No borrowing recorded yet.")}</div>`;
}

/* ----- Maintenance ----- */
function viewMaintenance() {
  const upcoming = S.assets.filter((a) => a.status !== "Disposed" && nextDue(a.id))
    .map((a) => ({ a, due: nextDue(a.id) })).sort((x, y) => x.due.localeCompare(y.due));
  return pageHead("Maintenance", "Servicing schedule and repair history",
      `<button class="btn btn-primary" data-action="log-service"><i class="bi bi-plus-lg me-1"></i>Log maintenance</button>`) + `
    <div class="card mb-4">
      <div class="card-header"><i class="bi bi-calendar-check me-2 text-primary"></i>Next services</div>
      ${upcoming.length ? `<div class="list-group list-group-flush">${upcoming.map(({ a, due }) => {
        const d = daysUntil(due);
        const b = d < 0 ? badge("danger", "Overdue") : d <= CFG.REMINDER_DAYS ? badge("warning", "Due soon") : badge("success", "Scheduled");
        return `<button class="list-group-item list-group-item-action d-flex justify-content-between align-items-center gap-2" data-action="open-asset" data-id="${a.id}">
          <span class="fw-bold">${esc(a.name)}</span><span class="text-nowrap">${fmtDate(due)} ${b}</span></button>`;
      }).join("")}</div>`
      : `<div class="card-body text-body-secondary">No services scheduled. When you log maintenance, add a “next service” date to get reminders.</div>`}
    </div>
    <div class="card">
      <div class="card-header"><i class="bi bi-journal-text me-2 text-primary"></i>History</div>
      ${S.maintenance.length ? `<div class="table-responsive"><table class="table align-middle mb-0">
        <thead><tr><th>Date</th><th>Item</th><th>Work done</th><th class="d-none d-md-table-cell">Done by</th><th class="text-end">Cost</th><th></th></tr></thead>
        <tbody>${S.maintenance.map((m) => `<tr>
          <td class="text-nowrap">${fmtDate(m.service_date)}</td>
          <td><a href="#" class="fw-bold text-decoration-none" data-action="open-asset" data-id="${m.asset_id}">${esc(assetName(m.asset_id))}</a></td>
          <td>${esc(m.description)}</td>
          <td class="d-none d-md-table-cell">${esc(m.performed_by || "—")}</td>
          <td class="text-end text-nowrap">${money(m.cost)}</td>
          <td class="text-end"><button class="btn btn-sm btn-outline-danger" data-action="delete-service" data-id="${m.id}" aria-label="Delete record"><i class="bi bi-trash"></i></button></td>
        </tr>`).join("")}</tbody></table></div>`
      : `<div class="card-body text-body-secondary">No maintenance logged yet.</div>`}
    </div>`;
}

/* ----- Reports ----- */
const REPORTS = {
  register: { title: "Asset register", rows: () => S.assets.map((a) => ({
    "Asset tag": a.asset_tag || "", "Name": a.name, "Category": nameOf(S.categories, a.category_id),
    "Location": nameOf(S.locations, a.location_id), "Ministry": nameOf(S.ministries, a.ministry_id),
    "Status": a.status, "Condition": a.condition, "Serial number": a.serial_number || "",
    "Purchase date": a.purchase_date || "", [`Cost (${CFG.CURRENCY})`]: a.cost === null ? "" : Number(a.cost)
  })) },
  ministry: { title: "Assets by ministry", rows: () => groupBy("ministry_id", S.ministries, "Ministry") },
  location: { title: "Assets by location", rows: () => groupBy("location_id", S.locations, "Location") },
  loans: { title: "Borrowing history", rows: () => S.borrowings.map((b) => ({
    "Item": assetName(b.asset_id), "Borrower": b.borrower_name, "Phone": b.borrower_phone || "",
    "Purpose": b.purpose || "", "Borrowed": b.borrowed_on, "Due back": b.due_on || "", "Returned": b.returned_on || "Not yet"
  })) },
  maintenance: { title: "Maintenance costs", rows: () => S.maintenance.map((m) => ({
    "Date": m.service_date, "Item": assetName(m.asset_id), "Work done": m.description,
    "Done by": m.performed_by || "", [`Cost (${CFG.CURRENCY})`]: m.cost === null ? "" : Number(m.cost), "Next service": m.next_due || ""
  })) }
};
function groupBy(field, list, label) {
  const held = S.assets.filter((a) => a.status !== "Disposed");
  const groups = [...list.map((x) => ({ id: x.id, name: x.name })), { id: null, name: "Not assigned" }];
  return groups.map((g) => {
    const items = held.filter((a) => (a[field] ?? null) === g.id);
    return { [label]: g.name, "Number of assets": items.length, [`Total value (${CFG.CURRENCY})`]: items.reduce((s, a) => s + Number(a.cost || 0), 0) };
  }).filter((r) => r["Number of assets"] > 0);
}
function viewReports() {
  return pageHead("Reports", "Download for audits and council meetings",
    `<button class="btn btn-outline-primary" data-action="export-xlsx"><i class="bi bi-file-earmark-excel me-1"></i>Download Excel</button>
     <button class="btn btn-primary" data-action="print"><i class="bi bi-printer me-1"></i>Print or save PDF</button>`) + `
    <ul class="nav nav-pills flex-wrap gap-1 mb-3 no-print">${Object.entries(REPORTS).map(([k, r]) =>
      `<li class="nav-item"><button class="nav-link ${S.report === k ? "active" : ""}" data-action="report" data-report="${k}">${r.title}</button></li>`).join("")}</ul>
    <div class="print-head"><img src="logo.png" alt=""><div>
      <div class="fw-bold fs-5">${esc(CFG.CHURCH_NAME)}, ${esc(CFG.BRANCH_NAME)}</div>
      <div class="fw-bold">${REPORTS[S.report].title}</div><div class="small">Printed ${fmtDate(today())}</div></div></div>
    <div id="report-out"></div>`;
}
function renderReport() {
  const rows = REPORTS[S.report].rows();
  const el = $("#report-out");
  if (!rows.length) { el.innerHTML = `<div class="card">${emptyState("file-earmark", "No records for this report yet.")}</div>`; return; }
  const cols = Object.keys(rows[0]);
  const isMoney = (c) => c.startsWith("Cost") || c.startsWith("Total value");
  const isNum = (c) => isMoney(c) || c.startsWith("Number");
  const totalCol = cols.find(isMoney);
  const total = totalCol ? rows.reduce((s, r) => s + (Number(r[totalCol]) || 0), 0) : null;
  el.innerHTML = `<div class="card"><div class="table-responsive"><table class="table table-striped align-middle mb-0">
    <thead><tr>${cols.map((c) => `<th class="${isNum(c) ? "text-end" : ""}">${esc(c)}</th>`).join("")}</tr></thead>
    <tbody>${rows.map((r) => `<tr>${cols.map((c) => `<td class="${isNum(c) ? "text-end text-nowrap" : ""}">${isMoney(c) ? (r[c] === "" ? "—" : money(r[c])) : esc(r[c])}</td>`).join("")}</tr>`).join("")}</tbody>
    ${totalCol ? `<tfoot class="table-group-divider"><tr>${cols.map((c, i) => `<td class="fw-bold ${isMoney(c) ? "text-end text-nowrap" : ""}">${i === 0 ? "Total" : c === totalCol ? money(total) : ""}</td>`).join("")}</tr></tfoot>` : ""}
  </table></div><div class="card-footer bg-white text-body-secondary small">${plural(rows.length, "row")}</div></div>`;
}

/* ---------- Dialogs ---------- */
function openModal(title, body) {
  $("#modal-title").innerHTML = title;
  $("#modal-body").innerHTML = body;
  $("#modal-body").scrollTop = 0;
  if (!modalOpen) bsModal.show();
  setTimeout(() => $("#modal-body").querySelector("form .form-control, form .form-select")?.focus(), modalOpen ? 0 : 320);
}
function closeModal() { bsModal.hide(); }

/* ---------- Excel import ---------- */
const IMPORT_COLS = [
  { key: "name", header: "Name *", width: 30 },
  { key: "asset_tag", header: "Asset tag", width: 16 },
  { key: "serial_number", header: "Serial number", width: 18 },
  { key: "category", header: "Category", width: 22 },
  { key: "location", header: "Location", width: 22 },
  { key: "ministry", header: "Ministry", width: 22 },
  { key: "status", header: "Status", width: 14 },
  { key: "condition", header: "Condition", width: 12 },
  { key: "purchase_date", header: "Purchase date (YYYY-MM-DD)", width: 26 },
  { key: "cost", header: `Cost (${CFG.CURRENCY})`, width: 14 },
  { key: "notes", header: "Notes", width: 40 }
];
const LOOKUPS = { category: ["categories", "category_id", "Category"], location: ["locations", "location_id", "Location"], ministry: ["ministries", "ministry_id", "Ministry"] };
const normHeader = (h) => String(h ?? "").toLowerCase().replace(/\(.*?\)|\*/g, "").replace(/[^a-z]/g, "");
const HEADER_KEYS = Object.fromEntries(IMPORT_COLS.map((c) => [normHeader(c.header), c.key]));
Object.assign(HEADER_KEYS, { tag: "asset_tag", serial: "serial_number", serialno: "serial_number", date: "purchase_date", purchased: "purchase_date", value: "cost", price: "cost", assetname: "name", item: "name", itemname: "name" });
const cellText = (v) => (v instanceof Date ? v : String(v ?? "").trim());
const isoDate = (y, m, d) => {
  const dt = new Date(Date.UTC(y, m - 1, d));
  if (dt.getUTCFullYear() !== y || dt.getUTCMonth() !== m - 1 || dt.getUTCDate() !== d || y < 1900 || y > 2100) return null;
  return `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
};
function parseDate(v) {
  if (v instanceof Date) { const t = new Date(v.getTime() + 12 * 3600e3); return isoDate(t.getFullYear(), t.getMonth() + 1, t.getDate()); }
  if (typeof v === "number") { const p = XLSX.SSF.parse_date_code(v); return p ? isoDate(p.y, p.m, p.d) : null; }
  const t = String(v).trim(); let m;
  if ((m = t.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})$/))) return isoDate(+m[1], +m[2], +m[3]);
  if ((m = t.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})$/))) return isoDate(+m[3], +m[2], +m[1]);
  return null;
}

function downloadTemplate(withData) {
  const head = IMPORT_COLS.map((c) => c.header);
  const rows = withData ? S.assets.map((a) => [a.name, a.asset_tag || "", a.serial_number || "",
    S.categories.find((x) => x.id === a.category_id)?.name || "", S.locations.find((x) => x.id === a.location_id)?.name || "",
    S.ministries.find((x) => x.id === a.ministry_id)?.name || "", a.status, a.condition, a.purchase_date || "",
    a.cost === null ? "" : Number(a.cost), a.notes || ""]) : [];
  const ws = XLSX.utils.aoa_to_sheet([head, ...rows]);
  ws["!cols"] = IMPORT_COLS.map((c) => ({ wch: c.width }));
  ws["!autofilter"] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: Math.max(rows.length, 1), c: head.length - 1 } }) };

  const lists = [["Categories", "Locations", "Ministries", "Status", "Condition"]];
  const n = Math.max(S.categories.length, S.locations.length, S.ministries.length, STATUSES.length, CONDITIONS.length);
  for (let i = 0; i < n; i++) lists.push([S.categories[i]?.name || "", S.locations[i]?.name || "", S.ministries[i]?.name || "", STATUSES[i] || "", CONDITIONS[i] || ""]);
  const wl = XLSX.utils.aoa_to_sheet(lists); wl["!cols"] = [24, 24, 24, 16, 12].map((w) => ({ wch: w }));

  const help = [
    [`${CFG.CHURCH_NAME}, ${CFG.BRANCH_NAME}: asset import template`], [""],
    ["How to use"],
    ["1. Fill in one asset per row on the Assets sheet. Do not rename or reorder the column headings."],
    ["2. Only Name is required. Leave any other cell empty if you don't know it."],
    ["3. Category, Location and Ministry: use names from the Lists sheet. New names are added to the app's lists for you."],
    [`4. Status must be one of: ${STATUSES.join(", ")}. Empty means "In use".`],
    [`5. Condition must be one of: ${CONDITIONS.join(", ")}. Empty means "Good".`],
    ["6. Purchase date: write it as 2024-03-15 (year-month-day). 15/03/2024 (day/month/year) also works."],
    [`7. Cost: numbers only, in ${CFG.CURRENCY}, e.g. 8500 or 8500.50.`],
    ["8. Asset tags must be unique. If a tag already exists in the app, that asset is updated instead of added twice."],
    ["9. Save the file, then in the app go to Assets → Import from Excel and upload it. You'll see a check of every row before anything is saved."],
    [""], ["Example row"], IMPORT_COLS.map((c) => c.header),
    ["Yamaha MG16 mixer", "COP-AEC-0001", "YM123456", "Sound & media", "Main auditorium", "Media team", "In use", "Good", "2024-03-15", 8500, "Donated by the youth ministry"]
  ];
  const wh = XLSX.utils.aoa_to_sheet(help); wh["!cols"] = [{ wch: 110 }];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Assets");
  XLSX.utils.book_append_sheet(wb, wh, "Instructions");
  XLSX.utils.book_append_sheet(wb, wl, "Lists");
  XLSX.writeFile(wb, withData ? `assets-${today()}.xlsx` : "asset-import-template.xlsx");
}

async function parseImportFile(file) {
  if (file.size > 5 * 1024 * 1024) throw new Error("This file is larger than 5 MB. Check that it is the asset template.");
  const wb = XLSX.read(await file.arrayBuffer(), { cellDates: true });
  const sheetName = wb.SheetNames.find((n) => n.toLowerCase() === "assets") || wb.SheetNames[0];
  const aoa = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, defval: "", raw: true, blankrows: false });
  const headerIdx = aoa.slice(0, 10).findIndex((r) => r.some((h) => HEADER_KEYS[normHeader(h)] === "name"));
  if (headerIdx < 0) throw new Error("No “Name” column was found. Download the template from this page and fill that in.");
  const colMap = {};
  aoa[headerIdx].forEach((h, i) => { const k = HEADER_KEYS[normHeader(h)]; if (k && !(k in colMap)) colMap[k] = i; });

  const byName = (list, name) => list.find((x) => x.name.trim().toLowerCase() === name.toLowerCase());
  const byTag = Object.fromEntries(S.assets.filter((a) => a.asset_tag).map((a) => [a.asset_tag.toLowerCase(), a]));
  const seenTags = {};
  const newLookups = { category: new Map(), location: new Map(), ministry: new Map() };
  const rows = [];

  aoa.slice(headerIdx + 1).forEach((r, i) => {
    const get = (k) => (k in colMap ? cellText(r[colMap[k]]) : "");
    if (IMPORT_COLS.every((c) => get(c.key) === "")) return;
    const line = headerIdx + i + 2, errors = [], notes = [], rec = {};
    const name = String(get("name"));
    if (!name) errors.push("Name is missing");
    else rec.name = name;

    for (const k of ["asset_tag", "serial_number", "notes"]) { const v = String(get(k)); if (v) rec[k] = v; }

    const status = String(get("status"));
    if (status) { const m = STATUSES.find((x) => x.toLowerCase() === status.toLowerCase()); m ? (rec.status = m) : errors.push(`Status “${status}” is not one of: ${STATUSES.join(", ")}`); }
    const cond = String(get("condition"));
    if (cond) { const m = CONDITIONS.find((x) => x.toLowerCase() === cond.toLowerCase()); m ? (rec.condition = m) : errors.push(`Condition “${cond}” is not one of: ${CONDITIONS.join(", ")}`); }

    for (const [k, [table, field, label]] of Object.entries(LOOKUPS)) {
      const v = String(get(k)); if (!v) continue;
      const hit = byName(S[table], v);
      if (hit) rec[field] = hit.id;
      else { const key = v.toLowerCase(); if (!newLookups[k].has(key)) newLookups[k].set(key, v); rec["_" + k] = key; notes.push(`New ${label.toLowerCase()}: ${v}`); }
    }

    const rawDate = get("purchase_date");
    if (rawDate !== "") { const d = parseDate(rawDate); d ? (rec.purchase_date = d) : errors.push(`Purchase date “${rawDate}” isn't a date. Use 2024-03-15`); }

    const rawCost = get("cost");
    if (rawCost !== "") {
      const n = typeof rawCost === "number" ? rawCost : Number(String(rawCost).replace(/[^0-9.\-]/g, ""));
      if (!isFinite(n) || n < 0 || String(rawCost).replace(/[^0-9]/g, "") === "") errors.push(`Cost “${rawCost}” isn't a number`);
      else rec.cost = Math.round(n * 100) / 100;
    }

    let action = "new", existing = null;
    if (rec.asset_tag) {
      const t = rec.asset_tag.toLowerCase();
      if (seenTags[t]) errors.push(`Asset tag ${rec.asset_tag} is also used on row ${seenTags[t]}`);
      else seenTags[t] = line;
      existing = byTag[t];
      if (existing) action = "update";
    }
    rows.push({ line, rec, action, id: existing?.id, errors, notes });
  });
  if (!rows.length) throw new Error("The file has headings but no assets. Add one asset per row under the headings.");
  return { file: file.name, rows, newLookups };
}

    </div>
    <div class="d-flex gap-3">
      <span class="badge rounded-circle text-bg-primary d-grid flex-none" style="width:2rem;height:2rem;place-items:center">2</span>
      <div class="flex-grow-1 min-w-0"><h3 class="h6 fw-bold mb-1">Upload the filled-in file</h3>
        <p class="text-body-secondary small mb-2">Every row is checked first. Nothing is saved until you confirm.</p>
        <input type="file" class="form-control" id="import-file" accept=".xlsx,.xls,.csv" aria-label="Choose the filled-in Excel file">
        <div id="import-preview" class="mt-3"></div>
      </div>
    </div>`);
}

function renderImportPreview() {
  const plan = S.importPlan, el = $("#import-preview"); if (!el || !plan) return;
  const ok = plan.rows.filter((r) => !r.errors.length);
  const adds = ok.filter((r) => r.action === "new").length, ups = ok.length - adds;
  const bad = plan.rows.length - ok.length;
  const newOnes = Object.entries(plan.newLookups).flatMap(([k, m]) => [...m.values()].map((v) => `${LOOKUPS[k][2]}: ${esc(v)}`));
  el.innerHTML = `
    <div class="d-flex flex-wrap gap-2 mb-2">
      ${adds ? badge("success", `${adds} to add`, "plus-circle") : ""}
      ${ups ? badge("primary", `${ups} to update`, "arrow-repeat") : ""}
      ${bad ? badge("danger", `${bad} with problems`, "exclamation-triangle") : ""}
    </div>
    ${bad ? `<div class="alert alert-danger small py-2"><b>Rows with problems will be skipped.</b> Fix them in Excel and upload the file again, or import the good rows now and add the rest later.</div>` : ""}
    ${newOnes.length ? `<div class="alert alert-info small py-2"><b>These will be added to your lists:</b> ${newOnes.join(", ")}</div>` : ""}
    <div class="table-responsive border rounded" style="max-height:300px">
      <table class="table table-sm align-middle mb-0 small">
        <thead class="sticky-top"><tr><th>Row</th><th>Name</th><th>Tag</th><th>Result</th></tr></thead>
        <tbody>${plan.rows.map((r) => `<tr class="${r.errors.length ? "table-danger" : ""}">
          <td>${r.line}</td><td>${esc(r.rec.name || "—")}</td><td class="text-nowrap">${esc(r.rec.asset_tag || "")}</td>
          <td>${r.errors.length ? r.errors.map(esc).join("<br>") : r.action === "update" ? badge("primary", "Update") : badge("success", "Add")}</td>
        </tr>`).join("")}</tbody>
      </table>
    </div>
    <div class="d-flex justify-content-end gap-2 mt-3">
      <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
      <button class="btn btn-primary" data-action="run-import" ${ok.length ? "" : "disabled"}>
        <i class="bi bi-check2-circle me-1"></i>${ok.length ? `Import ${plural(ok.length, "asset")}` : "Nothing to import"}</button>
    </div>`;
}

async function runImport(btn) {
  const plan = S.importPlan; if (!plan) return;
  const ok = plan.rows.filter((r) => !r.errors.length);
  const setBtn = (t) => (btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>${t}`);
  btn.disabled = true;
  let done = 0;
  try {
    setBtn("Updating lists");
    const newIds = {};
    for (const [k, m] of Object.entries(plan.newLookups)) {
      const needed = [...m.entries()].filter(([key]) => ok.some((r) => r.rec["_" + k] === key));
      if (!needed.length) continue;
      const { data, error } = await sb.from(LOOKUPS[k][0]).insert(needed.map(([, name]) => ({ name }))).select();
      if (error) throw error;
      newIds[k] = Object.fromEntries(data.map((x) => [x.name.trim().toLowerCase(), x.id]));
    }
    const finalRec = (r) => {
      const out = {};
      for (const [f, v] of Object.entries(r.rec)) if (!f.startsWith("_")) out[f] = v;
      for (const k of Object.keys(LOOKUPS)) if (r.rec["_" + k]) out[LOOKUPS[k][1]] = newIds[k][r.rec["_" + k]];
      return out;
    };
    const inserts = ok.filter((r) => r.action === "new").map((r) => Object.assign({ status: "In use", condition: "Good" }, finalRec(r)));
    for (let i = 0; i < inserts.length; i += 100) {
      setBtn(`Saving ${done + 1}–${Math.min(done + 100, ok.length)} of ${ok.length}`);
      const { error } = await sb.from("assets").insert(inserts.slice(i, i + 100)); if (error) throw error;
      done += Math.min(100, inserts.length - i);
    }
    for (const r of ok.filter((r) => r.action === "update")) {
      setBtn(`Saving ${done + 1} of ${ok.length}`);
      const { error } = await sb.from("assets").update({ ...finalRec(r), updated_at: new Date().toISOString() }).eq("id", r.id);
      if (error) throw error;
      done++;
    }
    S.importPlan = null; closeModal(); await refresh();
    toast(`Imported ${plural(done, "asset")}`);
  } catch (err) {
    await refresh();
    const el = $("#import-preview");
    if (el) el.insertAdjacentHTML("afterbegin", `<div class="alert alert-danger small">${done ? `${plural(done, "asset")} were saved before the import stopped. ` : ""}${esc(friendlyError(err))}. Upload the file again to retry the rest; saved rows with an asset tag will be updated, not duplicated.</div>`);
    btn.disabled = false; btn.textContent = "Import";
  }
}

/* ---------- Form handling ---------- */
const FORMS = {
  async asset(form) {
    const fd = new FormData(form), id = Number(form.dataset.id) || null;
    const old = id ? assetById(id) : null;
    const rec = {
      name: textOrNull(fd.get("name")), asset_tag: textOrNull(fd.get("asset_tag")), serial_number: textOrNull(fd.get("serial_number")),
      category_id: numOrNull(fd.get("category_id")), location_id: numOrNull(fd.get("location_id")), ministry_id: numOrNull(fd.get("ministry_id")),
      status: fd.get("status"), condition: fd.get("condition"), purchase_date: fd.get("purchase_date") || null,
      cost: numOrNull(fd.get("cost")), notes: textOrNull(fd.get("notes"))
    };
    const file = fd.get("photo");
    if (file && file.size) {
      if (file.size > 5 * 1024 * 1024) throw new Error("The photo is larger than 5 MB. Choose a smaller photo.");
      const ext = (file.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "");
      const path = `${crypto.randomUUID()}.${ext}`;
      const { error } = await sb.storage.from(BUCKET).upload(path, file, { contentType: file.type });
      if (error) throw error;
      rec.photo_path = path;
      if (old?.photo_path) await sb.storage.from(BUCKET).remove([old.photo_path]);
    }
    if (id) {
      rec.updated_at = new Date().toISOString();
      const { error } = await sb.from("assets").update(rec).eq("id", id); if (error) throw error;
      return { msg: "Changes saved", reopen: id };
    }
    const { data, error } = await sb.from("assets").insert(rec).select().single(); if (error) throw error;
    return { msg: "Asset added", reopen: data.id };
  },
  async loan(form) {
    const fd = new FormData(form);
    const due = fd.get("due_on") || null, borrowed = fd.get("borrowed_on");
    if (due && due < borrowed) throw new Error("The due-back date is before the borrowed date.");
    const { error } = await sb.from("borrowings").insert({
      asset_id: Number(fd.get("asset_id")), borrower_name: textOrNull(fd.get("borrower_name")), borrower_phone: textOrNull(fd.get("borrower_phone")),
      purpose: textOrNull(fd.get("purpose")), borrowed_on: borrowed, due_on: due, notes: textOrNull(fd.get("notes"))
    });
    if (error) throw error;
    return { msg: "Loan recorded" };
  },
  async service(form) {
    const fd = new FormData(form), assetId = Number(fd.get("asset_id"));
    const { error } = await sb.from("maintenance").insert({
      asset_id: assetId, service_date: fd.get("service_date"), description: textOrNull(fd.get("description")),
      cost: numOrNull(fd.get("cost")), performed_by: textOrNull(fd.get("performed_by")), next_due: fd.get("next_due") || null
    });
    if (error) throw error;
    if (fd.get("mark_in_use")) {
      const { error: e2 } = await sb.from("assets").update({ status: "In use", updated_at: new Date().toISOString() }).eq("id", assetId);
      if (e2) throw e2;
    }
    return { msg: "Maintenance saved" };
  },
  async list(form) {
    const name = textOrNull(new FormData(form).get("name")); if (!name) return {};
    const { error } = await sb.from(form.dataset.table).insert({ name }); if (error) throw error;
    return { msg: `“${name}” added` };
  }
};

document.addEventListener("submit", async (e) => {
  const form = e.target.closest("[data-form]"); if (!form) return;
  e.preventDefault();
  if (!form.checkValidity()) {
    form.classList.add("was-validated");
    form.querySelector(":invalid")?.focus();
    return;
  }
  const btn = form.querySelector("button[type=submit]"), errBox = form.querySelector(".js-error");
  const label = btn.innerHTML;
  btn.disabled = true; btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Saving`;
  if (errBox) errBox.hidden = true;
  try {
    const res = await FORMS[form.dataset.form](form);
    await refresh();
    if (res.msg) toast(res.msg);
    if (res.reopen) assetDetail(res.reopen);
    else if (form.closest("#modal")) closeModal();
  } catch (err) {
    const msg = friendlyError(err);
    if (errBox) { errBox.textContent = msg; errBox.hidden = false; } else toast(msg);
    btn.disabled = false; btn.innerHTML = label;
  }
});

/* ---------- Filters ---------- */
document.addEventListener("input", (e) => {
  if (e.target.id === "f-q") { S.filters.q = e.target.value; renderAssetResults(); }
});
document.addEventListener("change", (e) => {
  const map = { "f-category": "category", "f-location": "location", "f-ministry": "ministry", "f-status": "status" };
  if (map[e.target.id]) { S.filters[map[e.target.id]] = e.target.value; renderAssetResults(); }
  if (e.target.id === "import-file" && e.target.files[0]) {
    const el = $("#import-preview");
    el.innerHTML = `<div class="d-flex align-items-center gap-2 text-body-secondary small"><div class="spinner-border spinner-border-sm text-primary"></div>Checking the file…</div>`;
    parseImportFile(e.target.files[0])
      .then((plan) => { S.importPlan = plan; renderImportPreview(); })
      .catch((err) => { S.importPlan = null; el.innerHTML = `<div class="alert alert-danger small mb-0"><i class="bi bi-exclamation-triangle me-1"></i>${esc(err.message || "This file could not be read. Save it as an Excel (.xlsx) file and try again.")}</div>`; e.target.value = ""; });
  }
});
document.addEventListener("keydown", (e) => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches(".stat-card[data-action]")) { e.preventDefault(); e.target.click(); }
});

/* ---------- Click actions ---------- */
document.addEventListener("click", async (e) => {
  const el = e.target.closest("[data-action]"); if (!el) return;
  if (el.tagName === "A") e.preventDefault();
  const { action, id } = el.dataset;
  try {
    switch (action) {
      case "nav": S.view = el.dataset.view; closeMenu(); if (modalOpen) closeModal(); render(); window.scrollTo(0, 0); break;
      case "add-asset": assetForm(); break;
      case "open-asset": assetDetail(id); break;
      case "edit-asset": assetForm(assetById(id)); break;
      case "lend": loanForm(id); break;
      case "log-service": serviceForm(id); break;
      case "open-import": importDialog(); break;
      case "dl-template": downloadTemplate(!!el.dataset.with); break;
      case "run-import": await runImport(el); break;
      case "loan-tab": S.loanTab = el.dataset.tab; render(); break;
      case "report": S.report = el.dataset.report; render(); break;
      case "print": window.print(); break;
      case "export-xlsx": {
        const r = REPORTS[S.report], rows = r.rows();
        if (!rows.length) { toast("This report has no rows to download."); break; }
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), r.title.slice(0, 31));
        XLSX.writeFile(wb, `${r.title.toLowerCase().replace(/\s+/g, "-")}-${today()}.xlsx`);
        break;
      }
      case "return-loan": {
        el.disabled = true;
        const b = S.borrowings.find((x) => x.id === Number(id));
        const { error } = await sb.from("borrowings").update({ returned_on: today() }).eq("id", Number(id));
        if (error) throw error;
        await refresh(); toast("Marked as returned");
        if (modalOpen && b) assetDetail(b.asset_id);
        break;
      }
      case "delete-service": {
        if (!(await confirmDialog("Delete this maintenance record?", "<p class='mb-0'>This cannot be undone.</p>"))) break;
        const { error } = await sb.from("maintenance").delete().eq("id", Number(id)); if (error) throw error;
        await refresh(); toast("Record deleted"); break;
      }
      case "delete-asset": {
        const a = assetById(id);
        const ok = await confirmDialog(`Delete “${a.name}”?`,
          `<p>This also deletes all its borrowing and maintenance records, and cannot be undone.</p>
           <div class="alert alert-info mb-0 small"><i class="bi bi-lightbulb me-1"></i>To keep the history, edit the asset and set its status to “Disposed” instead.</div>`, "Delete asset");
        if (!ok) break;
        const { error } = await sb.from("assets").delete().eq("id", a.id); if (error) throw error;
        if (a.photo_path) await sb.storage.from(BUCKET).remove([a.photo_path]);
        closeModal(); await refresh(); toast("Asset deleted"); break;
      }
      case "delete-item": {
        const table = el.dataset.table;
        const item = (S[table] || []).find((x) => x.id === Number(id));
        if (!(await confirmDialog(`Remove “${item?.name ?? "this item"}”?`, "<p class='mb-0'>Assets using it will show “—” instead.</p>", "Remove"))) break;
        const { error } = await sb.from(table).delete().eq("id", Number(id)); if (error) throw error;
        await refresh(); toast("Removed"); break;
      }
      case "logout": closeMenu(); await sb.auth.signOut(); break;
    }
  } catch (err) { toast(friendlyError(err)); }
});

init();
</script>
